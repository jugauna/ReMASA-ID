# ReMASA ID - Orquestacion Docker Compose
# -----------------------------------------------------------------------------
# Identidad: Google OAuth (@remasa.com) + usuarios externos (htpasswd).
# Panel Django: remasa-id-admin (gestion de externos y sync a externo.htpasswd).
# Nginx termina TLS y aplica auth_request; Dozzle en PORT_LOGS.
#
# Persistencia (host): ./config, ./data/certs, ./data/db, ./data/logs/nginx, ./data/dozzle
# Prefijo de contenedores: remasa-id-*
# Repositorio: https://github.com/jugauna/ReMASA-ID.git
# -----------------------------------------------------------------------------

services:
  # Django admin: usuarios externos + SQLite; escribe /opt/remasa/config/externos.htpasswd
  remasa-id-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    image: remasa-id-admin:local
    container_name: remasa-id-admin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${SUBDOMAIN_ADMIN},remasa-id-admin,localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${SUBDOMAIN_ADMIN}
    volumes:
      - ./config:/opt/remasa/config
      - ./data/db:/app/db
    networks:
      - remasa-id-internal

  remasa-id-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: remasa-id-proxy
    restart: unless-stopped
    depends_on:
      - remasa-id-admin
    env_file:
      - .env
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_DOMAINS: .${DOMAIN_ROOT}
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${DOMAIN_ROOT}
      OAUTH2_PROXY_REDIRECT_URL: https://login.remasa.com/oauth2/callback
    command:
      - --http-address=0.0.0.0:4180
      - --provider=google
      - --email-domain=remasa.com
      - --authenticated-emails-file=/opt/remasa/config/authenticated_emails.txt
      - --htpasswd-file=/opt/remasa/config/externos.htpasswd
      - --display-htpasswd-form=true
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --pass-access-token=false
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-refresh=1h
      - --cookie-expire=8h
      - --upstream=file:///dev/null
      - --custom-templates-dir=/opt/remasa-proxy/templates
      # Plantilla unificada: ver proxy/custom_sign_in.html (montada como sign_in.html).
    volumes:
      - ./config:/opt/remasa/config:ro
      - ./proxy/custom_sign_in.html:/opt/remasa-proxy/templates/sign_in.html:ro
      - ./proxy/custom.css:/opt/remasa-proxy/templates/custom.css:ro
    networks:
      - remasa-id-internal

  remasa-id-nginx:
    image: nginx:1.27-alpine
    container_name: remasa-id-nginx
    restart: unless-stopped
    depends_on:
      - remasa-id-proxy
      - remasa-id-admin
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_ROOT: ${DOMAIN_ROOT}
      SUBDOMAIN_LOGIN: ${SUBDOMAIN_LOGIN}
      SUBDOMAIN_INTRANET: ${SUBDOMAIN_INTRANET}
      SUBDOMAIN_INVOICE: ${SUBDOMAIN_INVOICE}
      SUBDOMAIN_PYG: ${SUBDOMAIN_PYG}
      SUBDOMAIN_ADMIN: ${SUBDOMAIN_ADMIN}
      IP_HOSTINGER: ${IP_HOSTINGER}
      PORT_INVOICE_APP: ${PORT_INVOICE_APP}
      PORT_PYG_APP: ${PORT_PYG_APP}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ./dashboard:/var/www/intranet:ro
      - ./data/certs:/etc/nginx/certs:ro
      - ./data/logs/nginx:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - remasa-id-internal

  remasa-id-logs:
    image: amir20/dozzle:latest
    container_name: remasa-id-logs
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT_LOGS}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/dozzle:/data
    networks:
      - remasa-id-internal

networks:
  remasa-id-internal:
    driver: bridge
    name: remasa-id-internal
