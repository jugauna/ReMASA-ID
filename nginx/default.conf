# ReMASA ID - Nginx reverse proxy (produccion)
# -----------------------------------------------------------------------------
# Procesado con envsubst. VPS: 67.207.83.113 | Hostinger WP: 89.117.7.185
# Certificados: /etc/nginx/certs/fullchain.pem, privkey.pem
# Repo: https://github.com/jugauna/ReMASA-ID.git
# -----------------------------------------------------------------------------

map $auth_email $is_admin {
    include /etc/nginx/includes/admin_allow.map;
    default 0;
}

upstream oauth2_proxy {
    server remasa-id-proxy:4180;
}

upstream intranet_backend {
    server ${IP_HOSTINGER}:80;
}

upstream invoice_backend {
    server host.docker.internal:${PORT_INVOICE_APP};
}

upstream pyg_backend {
    server host.docker.internal:${PORT_PYG_APP};
}

upstream logs_backend {
    server remasa-id-logs:8080;
}

upstream admin_backend {
    server remasa-id-admin:8000;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name ${SUBDOMAIN_LOGIN} ${SUBDOMAIN_INTRANET} ${SUBDOMAIN_INVOICE} ${SUBDOMAIN_PYG} ${SUBDOMAIN_ADMIN} logs.${DOMAIN_ROOT};
    return 301 https://$host$request_uri;
}

# --- HTTPS: login (OAuth2) ---
server {
    listen 443 ssl;
    http2 on;
    server_name ${SUBDOMAIN_LOGIN};

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/includes/hardening_base.conf;
    include /etc/nginx/includes/hardening_csp_login.conf;

    location /oauth2/ {
        proxy_pass http://oauth2_proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location / {
        return 302 https://${SUBDOMAIN_INTRANET}$request_uri;
    }
}

# --- HTTPS: intranet (Hostinger / WordPress) ---
# Sin CSP estricta aqui: WordPress suele requerir inline scripts/estilos.
server {
    listen 443 ssl;
    http2 on;
    server_name ${SUBDOMAIN_INTRANET};

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/includes/hardening_base.conf;

    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2_proxy/oauth2/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location /oauth2/ {
        proxy_pass http://oauth2_proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Scheme $scheme;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;

        auth_request_set $auth_email $upstream_http_x_auth_request_email;
        auth_request_set $auth_user $upstream_http_x_auth_request_user;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_pass http://intranet_backend;
        proxy_set_header Host ${SUBDOMAIN_INTRANET};
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Auth-Request-Email $auth_email;
        proxy_set_header X-Auth-Request-User $auth_user;
    }
}

