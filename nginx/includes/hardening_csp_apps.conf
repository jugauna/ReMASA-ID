# ReMASA ID - CSP estricta para apps Django / SPA (invoice, pyg, logs)
# Incluye unsafe-inline para compatibilidad con admin Django y frontends tipicos.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' wss: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; object-src 'none'; upgrade-insecure-requests" always;
