# ReMASA ID - CSP para login.remasa.com (plantilla OAuth2 con estilos/JS inline controlados)
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self' https://accounts.google.com; frame-ancestors 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-src https://accounts.google.com; object-src 'none'; script-src 'self' 'unsafe-inline'; upgrade-insecure-requests" always;
