# ReMASA ID - CSP estricta para login.remasa.com (OAuth2 Proxy, sin WordPress)
# Permite estilos propios, redireccion a Google y minimiza vectores XSS.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self' https://accounts.google.com; frame-ancestors 'self'; img-src 'self' data: https:; style-src 'self'; font-src 'self' data:; connect-src 'self'; frame-src https://accounts.google.com; object-src 'none'; script-src 'none'; upgrade-insecure-requests" always;
