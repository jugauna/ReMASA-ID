<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Acceso seguro ReMASA ID" />
    <title>ReMASA ID — Acceso</title>
    <link rel="stylesheet" href="/oauth2/static/custom.css" />
  </head>
  <body class="login-page">
    <div class="login-backdrop" aria-hidden="true"></div>
    <main class="login-shell">
      <header class="brand" role="banner">
        <div class="brand-logo" aria-label="ReMASA">
          <span class="brand-logo__mark">Re</span><span class="brand-logo__text">MASA</span>
        </div>
        <p class="brand-tagline">Identidad y acceso corporativo</p>
      </header>

      <section class="login-card" aria-labelledby="login-title">
        <h1 id="login-title" class="login-title">Iniciar sesión</h1>
        <p class="login-lead">
          Utiliza tu cuenta <strong>@remasa.com</strong> para continuar de forma segura.
        </p>
        <a class="btn-google" href="{{ .SignInURL }}">
          <span class="btn-google__icon" aria-hidden="true">G</span>
          Continuar con Google
        </a>
        <p class="login-footnote">
          Al continuar aceptas el uso de cookies de sesión seguras para este dominio.
        </p>
      </section>

      <footer class="login-footer">
        <a href="https://remasa.com/" rel="noopener noreferrer" target="_blank">remasa.com</a>
        <span class="dot" aria-hidden="true">·</span>
        <span>ReMASA ID</span>
      </footer>
    </main>
  </body>
</html>
